name: GitHub Stats

# Redraws assets/generated/*.svg (contribution chart, streaks, languages)
on:
  schedule:
    - cron: "17 0 * * *" # daily, 00:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/github-stats.yml"

permissions:
  contents: write

concurrency:
  group: github-stats
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Refresh GitHub stats
        env:
          GH_USER: ${{ github.repository_owner }}
          # Optional: add a repo secret METRICS_TOKEN (fine-grained PAT, read-only
          # "Metadata" on all your repos) so the language card includes private repos.
          GH_TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: node scripts/update-stats.mjs

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/generated
          git diff --staged --quiet && echo "No changes" && exit 0
          git commit -m "chore: update GitHub stats [skip ci]"
          git push
